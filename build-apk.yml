name: GERAR APK NOBRE V4.6 GRADLE CORRIGIDO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Conferir estrutura
        run: |
          echo "===== build.gradle ====="
          cat build.gradle
          echo "===== app/build.gradle ====="
          cat app/build.gradle
          echo "===== settings.gradle ====="
          cat settings.gradle
          gradle --version

      - name: Gerar APK
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NOBRE_SERVICOS_V4_6.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOBRE-SERVICOS-V4-6
          path: NOBRE_SERVICOS_V4_6.apk
