plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace = 'com.nobreflorestal.inventario'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.nobreflorestal.inventario'
        minSdk = 26
        targetSdk = 35
        versionCode = 22
        versionName = '4.7'
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

/*
 * Compatibilidade com workflows antigos que procuram o APK em:
 * app/build/outputs/apk/debug/app-debug.apk
 */
tasks.register('copiarApkParaCaminhoAntigo', Copy) {
    from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
    into layout.projectDirectory.dir('app/build/outputs/apk/debug')
}

tasks.named('assembleDebug').configure {
    finalizedBy tasks.named('copiarApkParaCaminhoAntigo')
}
